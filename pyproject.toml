[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeflow-cli"
version = "0.1.0"
description = "NodeFlow local-agent command-line bridge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.scripts]
nodeflow = "cli.nodeflow:main"

[tool.setuptools]
packages = ["cli"]
